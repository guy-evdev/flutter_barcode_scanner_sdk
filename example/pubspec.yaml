name: flutter_barcode_scanner_sdk_example
description: Demonstrates how to use the flutter_barcode_scanner_sdk plugin.
publish_to: "none"

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_barcode_scanner_sdk:
    path: ../
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  config:
    enable-swift-package-manager: true
  uses-material-design: true
