name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  flutter:
    name: Flutter ${{ matrix.flutter-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        flutter-version: [3.44.0, 3.44.6]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ matrix.flutter-version }}
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build example Android debug APK
        working-directory: example
        run: flutter build apk --debug

      # Flutter creates the example app's Gradle wrapper during the build above.
      - name: Test Android plugin
        working-directory: example/android
        run: ./gradlew :flutter_barcode_scanner_sdk:testDebugUnitTest

  ios:
    name: iOS SwiftPM
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.6
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build example iOS simulator app
        working-directory: example
        run: flutter build ios --simulator --debug

      - name: Run iOS native tests
        working-directory: example/ios
        run: >-
          xcodebuild test
          -workspace Runner.xcworkspace
          -scheme Runner
          -destination 'platform=iOS Simulator,OS=latest,name=iPhone 17 Pro'

  ios-cocoapods:
    name: iOS CocoaPods compatibility
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.6
          channel: stable
          cache: true

      - name: Disable Swift Package Manager for this compatibility build
        run: flutter config --no-enable-swift-package-manager

      - name: Get dependencies
        run: flutter pub get

      - name: Build example iOS simulator app with CocoaPods
        working-directory: example
        run: flutter build ios --simulator --debug
