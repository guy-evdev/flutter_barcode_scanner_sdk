# flutter-package template rev 1 — per-push lane.
# Kept fast enough to actually wait for. Slow and macOS-hosted checks live in release.yml.
# See CLAUDE.md §4 and §6.

name: CI

on:
  push:
    branches: [main, 'release/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Verifies the Flutter floor advertised in pubspec.yaml (>=3.44.0). Nothing else does.
  # This replaces the old [3.44.0, 3.44.6] matrix, which spent a whole extra job comparing two
  # adjacent patch releases of the same minor.
  minimum-sdk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up minimum Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.0
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  gates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up latest stable Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter --version
      - run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - run: flutter analyze

      - name: VM tests with coverage
        run: flutter test --coverage

      # Ratchets up, never down (CLAUDE.md §4). Measured 64.50% (338/524) on 2026-08-02.
      - name: Enforce 64% line coverage
        run: |
          awk -F '[:,]' '$1 == "DA" { total++; covered += ($3 > 0) } END { if (total == 0 || covered * 100 / total < 64) exit 1; printf "Line coverage: %.2f%%\n", covered * 100 / total }' coverage/lcov.info

      # Cheap, and the only thing that catches a new top-level file leaking into the archive.
      - name: Publish validation
        run: flutter pub publish --dry-run

  # Android is ubuntu-hosted and fast enough to stay on every push. The example app's Gradle
  # wrapper is created by the debug build above it.
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build example Android debug APK
        working-directory: example
        run: flutter build apk --debug
      - name: Test Android plugin
        working-directory: example/android
        run: ./gradlew :flutter_barcode_scanner_sdk:testDebugUnitTest

  # No Chrome lane: this package has no web support. A `flutter test --platform chrome` job here
  # would compile nothing the VM lane does not already cover.
  # macOS lanes (iOS SwiftPM + XCTest, CocoaPods compatibility) are in release.yml — they bill at
  # roughly 10x ubuntu and assert compatibility claims that change rarely.
